<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="whoami: Jeison Guarguati — Estudiante de IA y Deep Learning">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace; }
    .t-dim { fill:#7d8590; font-size:13px; }
    .t-key { fill:#8b949e; font-size:14px; }
    .t-cyan { fill:#56d4dd; }
    .t-pink { fill:#ff7eb6; }
    .t-yel  { fill:#ffd580; }
    .t-lav  { fill:#c4a7ff; }
    .t-mint { fill:#7ee7b8; }
    .t-txt  { fill:#e6edf3; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .node { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: .0s } .d2 { animation-delay: .3s } .d3 { animation-delay: .6s }
    .d4 { animation-delay: .9s } .d5 { animation-delay: 1.2s } .d6 { animation-delay: 1.5s }
    @keyframes pulse { 0%,100% { opacity:.55; transform: scale(1); } 50% { opacity:1; transform: scale(1.25); } }
    .edge { stroke:#56d4dd; stroke-opacity:.28; stroke-width:1.2; }
    .flow { stroke:#ff7eb6; stroke-width:1.6; stroke-dasharray: 6 60; animation: flow 2.6s linear infinite; fill:none; }
    .flow2 { stroke:#c4a7ff; animation-duration: 3.4s; animation-delay: .8s; }
    @keyframes flow { to { stroke-dashoffset: -66; } }
    .bar { animation: grow 4s ease-out infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes grow { 0% { transform: scaleX(.05); } 70%,100% { transform: scaleX(1); } }
  </style>

  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4a7ff"/>
      <stop offset="1" stop-color="#56d4dd"/>
    </linearGradient>
  </defs>

  <!-- ventana -->
  <rect x="6" y="6" width="848" height="318" rx="16" fill="#0d1117"/>
  <rect x="14" y="14" width="832" height="302" rx="12" fill="#14161c" stroke="url(#frame)" stroke-width="1.6"/>
  <circle cx="38" cy="38" r="5.5" fill="#ff7b72"/>
  <circle cx="56" cy="38" r="5.5" fill="#ffd580"/>
  <circle cx="74" cy="38" r="5.5" fill="#7ee7b8"/>
  <text x="96" y="43" class="mono t-dim">jeigeek · neural shell · training…</text>
  <line x1="30" y1="58" x2="830" y2="58" stroke="#30363d"/>

  <!-- panel izquierdo -->
  <rect x="30" y="72" width="530" height="228" rx="10" fill="#181b22" stroke="#c4a7ff" stroke-opacity=".7"/>
  <text x="50" y="104" class="mono" font-size="18" font-weight="700"><tspan class="t-cyan">❯ whoami</tspan></text>
  <text x="50" y="132" class="mono" font-size="16"><tspan class="t-txt">jeison_guarguati</tspan><tspan class="t-dim">  —  </tspan><tspan class="t-yel">AI &amp; Deep Learning Student</tspan></text>
  <line x1="50" y1="146" x2="540" y2="146" stroke="#30363d"/>
  <text x="50" y="170" class="mono t-key">context:</text>
  <text x="160" y="170" class="mono t-lav" font-size="14">Ingeniería de Sistemas · Colombia</text>
  <text x="50" y="194" class="mono t-key">mission:</text>
  <text x="160" y="194" class="mono t-mint" font-size="14">entrenar modelos que ayuden a personas</text>

  <text x="50" y="228" class="mono" font-size="16" font-weight="700"><tspan class="t-cyan">❯ ls research/</tspan></text>
  <text x="50" y="254" class="mono t-pink" font-size="13.5">computer-vision/</text>
  <text x="210" y="254" class="mono t-txt" font-size="13.5">ViT · Swin · YOLOv11 · térmicas</text>
  <text x="50" y="278" class="mono t-pink" font-size="13.5">medical-imaging/</text>
  <text x="210" y="278" class="mono t-txt" font-size="13.5">MRI · U-Net · DeepLabV3+</text>
  <rect x="440" y="266" width="9" height="16" fill="#56d4dd" class="cursor"/>

  <!-- panel derecho: red neuronal viva -->
  <rect x="576" y="72" width="254" height="228" rx="10" fill="#181b22" stroke="#56d4dd" stroke-opacity=".7"/>
  <text x="596" y="102" class="mono t-yel" font-size="14">neural runtime</text>

  <g>
    <!-- conexiones -->
    <g class="edge">
      <line x1="620" y1="140" x2="703" y2="128"/><line x1="620" y1="140" x2="703" y2="170"/><line x1="620" y1="140" x2="703" y2="212"/>
      <line x1="620" y1="190" x2="703" y2="128"/><line x1="620" y1="190" x2="703" y2="170"/><line x1="620" y1="190" x2="703" y2="212"/>
      <line x1="620" y1="240" x2="703" y2="128"/><line x1="620" y1="240" x2="703" y2="170"/><line x1="620" y1="240" x2="703" y2="212"/>
      <line x1="703" y1="128" x2="786" y2="165"/><line x1="703" y1="170" x2="786" y2="165"/><line x1="703" y1="212" x2="786" y2="165"/>
      <line x1="703" y1="128" x2="786" y2="215"/><line x1="703" y1="170" x2="786" y2="215"/><line x1="703" y1="212" x2="786" y2="215"/>
    </g>
    <!-- señales viajando (forward pass) -->
    <path class="flow" d="M620 140 L703 170 L786 165"/>
    <path class="flow flow2" d="M620 240 L703 128 L786 215"/>
    <path class="flow" d="M620 190 L703 212 L786 165" style="animation-delay:1.4s"/>
    <!-- neuronas -->
    <circle class="node d1" cx="620" cy="140" r="7" fill="#c4a7ff"/>
    <circle class="node d2" cx="620" cy="190" r="7" fill="#c4a7ff"/>
    <circle class="node d3" cx="620" cy="240" r="7" fill="#c4a7ff"/>
    <circle class="node d4" cx="703" cy="128" r="7" fill="#56d4dd"/>
    <circle class="node d5" cx="703" cy="170" r="7" fill="#56d4dd"/>
    <circle class="node d6" cx="703" cy="212" r="7" fill="#56d4dd"/>
    <circle class="node d2" cx="786" cy="165" r="8" fill="#ff7eb6"/>
    <circle class="node d5" cx="786" cy="215" r="8" fill="#ff7eb6"/>
  </g>

  <!-- barra de entrenamiento -->
  <rect x="596" y="262" width="214" height="6" rx="3" fill="#30363d"/>
  <rect x="596" y="262" width="214" height="6" rx="3" fill="url(#frame)" class="bar"/>
  <text x="596" y="288" class="mono t-dim" font-size="12">epoch ∞ · loss ↓ · aprendiendo</text>
</svg>
